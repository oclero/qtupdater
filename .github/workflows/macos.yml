name: MacOS

on:
  push:
    branches:
      - master
      - dev
      - setup-ci
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtwebsockets qthttpserver"

      - name: Configure CMake
        run: cmake --preset macos

      - name: Build library
        run: cmake --build --preset macos

      - name: Build tests
        run: cmake --build --preset macos-test

      - name: Run tests
        run: ctest --preset macos
