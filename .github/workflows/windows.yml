name: Windows

on:
  push:
    branches:
      - master
      - dev
      - setup-ci
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebsockets qthttpserver"

      - name: Configure CMake
        run: cmake --preset windows

      - name: Build library
        run: cmake --build --preset windows

      - name: Build tests
        run: cmake --build --preset windows-test

      - name: Run tests
        run: ctest --preset windows
